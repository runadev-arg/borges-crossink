; Test image for QEMU. A separate config on purpose: PlatformIO deletes the whole build dir
; when the project config changes, so an env in platformio.ini or platformio.local.ini costs
; every other build in the tree a full rebuild. This one keeps its own build dir.
;
;   pio run -c test/borges_qemu/platformio-qemu.ini -e borges-qemu
;
; custom_sdkconfig is inherited verbatim from [firmware_tuned], so pioarduino sees the same
; hash in sdkconfig.defaults and does not rebuild the shared framework libs.
[platformio]
extra_configs = platformio.ini
build_dir = D:/CrossInkBorges/tmp/qemu/ws/build
; scripts/patch_sdfat.py insists on .pio/libdeps. Each env has its own folder there.
libdeps_dir = .pio/libdeps

[env:borges-qemu]
extends = firmware_tuned
custom_firmware_device_type = x3-x4
lib_deps =
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  wolfssl/Arduino-wolfSSL @ 5.7.2
extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:test/borges_qemu/eth_paths.py
build_src_filter =
  -<*>
  +<borges/net/BorgesHttp.cpp>
  +<borges/net/BorgesDns.cpp>
  +<borges/net/BorgesClock.cpp>
  +<borges/net/BorgesDevice.cpp>
  +<../test/borges_qemu/src/*>
  +<../test/borges_qemu/fw_stub/*.c>
build_flags =
  ${base.build_flags}
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Isrc
  -Isrc/borges/net
  -Itest/borges_qemu/src
  -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=heap_caps_malloc,--wrap=heap_caps_calloc
  -Wl,--wrap=wolfSSL_UseMaxFragment,--wrap=adc_hal_self_calibration,--wrap=esp_phy_enable,--wrap=esp_phy_disable,--wrap=phy_change_channel

; The real firmware, logs on UART0 and the ADC calibration stubbed, to see how far it boots.
[env:qemu-fw]
extends = firmware_tuned
custom_firmware_device_type = x3-x4
build_src_filter = +<*> +<../test/borges_qemu/fw_stub/*.c> +<../test/borges_qemu/fw_only/*.c>
build_flags =
  ${base.build_flags}
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DCROSSINK_APP_CAP_USB_DRIVE=0
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSINK_APP_CAP_TOUCH=0
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x3-x4\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -Wl,--wrap=adc_hal_self_calibration,--wrap=adc_oneshot_hal_convert

; The two hot paths of the underlines, on their own: no network, nothing but the core and the allocator.
[env:underline-bench]
extends = firmware_tuned
custom_firmware_device_type = x3-x4
lib_deps =
extra_scripts =
build_src_filter = -<*> +<../test/borges_qemu/bench/*.cpp> +<../test/borges_qemu/fw_stub/*.c>
build_flags =
  ${base.build_flags}
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DLOG_LEVEL=0
  -Ilib/BorgesCore
  -Ilib/Utf8
  -Wl,--wrap=adc_hal_self_calibration,--wrap=adc_oneshot_hal_convert
